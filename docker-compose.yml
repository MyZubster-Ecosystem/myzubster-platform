version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: myzubster-mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - myzubster_network

  gateway:
    build: ./gateway
    container_name: myzubster-gateway
    restart: always
    ports:
      - "10003:10000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=10000
      - MONGODB_URI=mongodb://mongodb:27017/myzubster
    env_file:
      - .env
    networks:
      - myzubster_network

networks:
  myzubster_network:
    driver: bridge

volumes:
  mongodb_data:
